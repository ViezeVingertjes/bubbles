[book]
title = "Bubbles Dialogue"
authors = ["ViezeVingertjes"]
description = "A friendly guide to Bubbles - a lightweight, engine-agnostic dialogue runtime for Rust games."
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/ViezeVingertjes/bubbles"
edit-url-template = "https://github.com/ViezeVingertjes/bubbles/edit/main/book/src/{path}"
default-theme = "ayu"
preferred-dark-theme = "ayu"
no-section-label = false
additional-css = ["theme/custom.css"]

[output.html.playground]
editable = false
copyable = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[preprocessor.links]
