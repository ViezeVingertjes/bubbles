[package]
name          = "bubbles-dialogue"
version.workspace = true
description   = "Embeddable, deterministic dialogue runtime for Rust and WebAssembly."
documentation = "https://docs.rs/bubbles-dialogue"
readme        = "../../README.md"
keywords      = ["dialogue", "deterministic", "embeddable", "state-machine", "scripting"]
categories    = ["game-development", "wasm", "simulation", "text-processing"]
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

# crates.io package is `bubbles-dialogue`; Rust import path stays `bubbles`.
[lib]
name = "bubbles"

[features]
default = ["rand"]
full    = ["rand", "serde"]
rand    = ["dep:rand"]
serde   = ["dep:serde", "indexmap/serde"]

[dependencies]
indexmap  = "2"
logos     = "0.16"
thiserror = "2"
rand      = { version = "0.10", optional = true }
serde     = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
# Default features pull in plotters and rayon for HTML reports we do not use;
# `cargo_bench_support` alone is what `cargo bench` needs.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
serde_json = "1"

[[bench]]
name    = "compile"
harness = false

[[bench]]
name    = "runtime"
harness = false

[lints]
workspace = true
