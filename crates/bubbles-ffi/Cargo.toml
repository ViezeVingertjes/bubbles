[package]
name        = "bubbles-ffi"
version     = "0.5.0"
description = "C ABI for bubbles-dialogue (Unity / P/Invoke and other native hosts)."
readme      = "README.md"
keywords    = ["dialogue", "ffi", "unity", "game-development", "interop"]
categories  = ["game-development", "api-bindings"]
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true
publish                = false

[lib]
name       = "bubbles_ffi"
crate-type = ["cdylib", "lib"]

[dependencies]
bubbles-dialogue = { path = "../bubbles-dialogue", features = ["full"] }
serde_json         = "1"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "allow"
