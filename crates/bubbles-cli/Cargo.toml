[package]
name          = "bubbles-cli"
version.workspace = true
description   = "Check and play .bub dialogue scripts: a CI-friendly checker for the bubbles-dialogue runtime."
documentation = "https://docs.rs/bubbles-cli"
readme        = "README.md"
keywords      = ["dialogue", "cli", "linter", "validate", "scripting"]
categories    = ["command-line-utilities", "development-tools", "game-development"]
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[[bin]]
name = "bubbles"
path = "src/main.rs"
# The runtime's lib target is also called `bubbles`, and rustdoc writes both to
# `target/doc/bubbles`. Nothing consumes rustdoc for a binary, so skip it.
doc  = false

# Everything except `tests/check.rs` exercises the player, so it needs the
# player's dependencies. `cargo test --no-default-features` then runs exactly
# the suite that the checker-only install has to keep passing.
[[test]]
name              = "errors"
required-features = ["tui"]

[[test]]
name              = "keys"
required-features = ["tui"]

[[test]]
name              = "multifile"
required-features = ["tui"]

[[test]]
name              = "options"
required-features = ["tui"]

[[test]]
name              = "playback"
required-features = ["tui"]

[[test]]
name              = "render"
required-features = ["tui"]

[[test]]
name              = "rerun"
required-features = ["tui"]

[[test]]
name              = "rewind"
required-features = ["tui"]

[[test]]
name              = "transcript"
required-features = ["tui"]

[features]
default = ["tui"]
# The interactive player. Off, `bubbles check` is all that is built and the only
# dependencies are the library's own three - small enough for someone else's CI.
tui     = ["dep:crossterm", "dep:ratatui", "bubbles-dialogue/full"]

[dependencies]
bubbles-dialogue = { version = "2.0.0", path = "../bubbles-dialogue", default-features = false }
crossterm = { version = "0.29.0", optional = true }
ratatui   = { version = "0.30.0", optional = true }

[lints]
workspace = true
