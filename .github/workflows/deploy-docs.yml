name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Opt into the Node 24 runtime early so JavaScript actions that still
  # bundle the Node 20 runner don't emit deprecation warnings on every run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # Enables Pages on the repo and switches its source to GitHub Actions
      # the first time this workflow runs. Without this step the deploy step
      # can appear to succeed while the repo is still serving from a branch
      # source (or nothing at all) — which is exactly the "action is green
      # but the site 404s" failure mode.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      # Run mdbook from *inside* the `book/` directory. mdBook resolves
      # `--dest-dir` relative to the current working directory, **not** the
      # positional book root, so the previous `mdbook build book --dest-dir
      # ../site` silently wrote to `<repo>/../site` — a directory outside
      # the workspace that the artifact upload never saw. Rustdoc alone made
      # it into the site, which is why `/api/` served but the book root 404'd.
      - name: Build the book
        working-directory: book
        run: mdbook build -d ../site

      - name: Verify book output
        run: |
          test -f site/index.html || { echo "mdbook did not produce site/index.html"; ls -la site || true; exit 1; }
          test -f site/introduction.html || { echo "mdbook missing introduction.html"; exit 1; }

      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p bubbles-dialogue --no-deps --all-features

      - name: Move rustdoc under /api
        run: |
          mkdir -p site/api
          cp -R target/doc/. site/api/
          # Landing redirect so /api/ goes straight to the crate.
          cat > site/api/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>Redirecting…</title>
          <meta http-equiv="refresh" content="0; url=bubbles/index.html">
          <link rel="canonical" href="bubbles/index.html">
          <p><a href="bubbles/index.html">Continue to the Bubbles API reference</a>.</p>
          EOF

      # Opt out of Jekyll so Pages serves our rustdoc assets verbatim —
      # rustdoc writes to `static.files/` and (for older toolchains) paths
      # that start with `_`, which Jekyll would otherwise strip.
      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
