name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check version sync (workspace, VERSION, README)
        run: bash scripts/check-version-sync.sh

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (all features, workspace)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Test (all features, workspace)
        run: cargo test --workspace --all-features

      - name: Test (no default features, bubbles-dialogue)
        run: cargo test -p bubbles-dialogue --no-default-features

      - name: WebAssembly (library)
        run: bash scripts/check-wasm.sh

      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

      - name: File-size check
        run: bash scripts/check-file-sizes.sh

      - name: Setup .NET SDK (bubbles-ffi smoke)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: bubbles-ffi P/Invoke smoke (.NET)
        run: |
          cargo build -p bubbles-ffi --release
          cd crates/bubbles-ffi/tests/dotnet_smoke
          LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/target/release" dotnet run -c Release

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | grep -oP '"\K[^"]+')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Check (MSRV, all features)
        run: cargo check --workspace --all-features
