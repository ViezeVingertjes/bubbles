name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Verify that the Git tag (e.g. v0.3.0 or 0.3.0) matches the version
      # declared in bubbles-dialogue/Cargo.toml.  This stops an accidental
      # publish when a tag is cut without bumping the manifest.
      - name: Check version matches release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"   # strip leading 'v', if any
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "
          import json, sys
          meta = json.load(sys.stdin)
          pkg = next(p for p in meta['packages'] if p['name'] == 'bubbles-dialogue')
          print(pkg['version'])
          ")
          if [ "$TAG" != "$CRATE_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match Cargo.toml version '$CRATE_VERSION'."
            exit 1
          fi
          echo "Version check passed: $CRATE_VERSION"

      # Run a quick sanity-check (no clippy, no doc build — CI already did
      # those on the commit; this just guards against broken publish paths).
      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: Publish bubbles-dialogue
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p bubbles-dialogue
